# v5 (v5-simple-reward) W&B sweep for Qwen2.5-3B (see README, "v5"). Changes from v4:
#   - simple reward on exact command names, parameters ignored: broken -10, repeat -6, new +5
#     (+5 split across group answers with the same name, as in v3); the reward detects no hacks on purpose
#   - training prompts: sweeps/pooled/histories_clean.jsonl (v4's pooled prompts after clean_histories.py)
#   - random search, so trials spread evenly over the ranges instead of gathering where the metric
#     is high; the question is which settings lead to hacking (final_hack_share)
#   - eval: list rule exact, 30 lists; base_eval is the seed-0 baseline (evaluate.py --list-rule exact)
#   wandb sweep sweep_3b_v5.yaml
#   sbatch --account=def-sfischme --array=1-30%3 compute_canada/agent.sh <entity/project/id>   # on Nibi
program: wandb_trial.py
project: command-novelty-rl
name: qwen2.5-3b-v5
method: random
run_cap: 30                               # trials in total; a random sweep has no other end
metric:                                   # not used to pick settings (random); shown in the W&B sweep view
  name: final_new_commands
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - ${program}
parameters:
  # searched (v2 ranges)
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-4
  beta:
    distribution: uniform
    min: 0.0
    max: 0.1
  temperature:
    distribution: uniform
    min: 0.8
    max: 1.3
  num_generations:
    values: [4, 8, 16]                    # GRPO group size; 32 completions per step either way
  # fixed: the same in every trial
  model:
    value: Qwen/Qwen2.5-3B-Instruct
  target:
    value: KORAD KA3005P Power Supply
  interface:
    value: RS232 interface
  histories:
    value: sweeps/pooled/histories_clean.jsonl
  base_eval:
    value: sweeps/baseline/3b/seed0/eval_steps.csv
  out_dir:
    value: sweeps/3b-v5/wandb
  trial_steps:
    value: 150
  sample_every:
    value: 10
  micro_batch:                            # completions per forward/backward pass
    value: 4
  grad_accum:                             # micro-batches per update: 4 x 8 = 32 completions per step
    value: 8
  generation_batch:                       # completions generated at once (raised to num_generations if smaller); fits an 80 GB H100
    value: 16
  version:                                # added to each run as a W&B tag
    value: v5
  # evaluation, must match the baseline (sweeps/baseline/<size>/seed0) so gain_over_base is comparable
  eval_episodes:
    value: 30
  eval_length:                            # commands per eval list (evaluate.py --steps)
    value: 150
  batch_size:                             # lists generated at once in eval
    value: 16
  seed:
    value: 0

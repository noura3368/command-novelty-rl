# W&B sweep: Bayesian search over the training values below.
#   wandb sweep sweep.yaml                                    -> prints the sweep id
#   CUDA_VISIBLE_DEVICES=1 wandb agent --count 30 <entity/project/id>
# Run the agents from the repo folder. The paths below are relative to it.
program: wandb_trial.py
project: command-novelty-rl
method: bayes
metric:
  name: final_unique_commands
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - ${program}
parameters:
  # searched
  lr:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4
  beta:
    distribution: uniform
    min: 0.0
    max: 0.1
  temperature:
    distribution: uniform
    min: 0.8
    max: 1.3
  # fixed: the same in every trial
  model:
    value: Qwen/Qwen2.5-3B-Instruct
  target:
    value: KORAD KA3005P Power Supply
  interface:
    value: RS232 interface
  histories:
    value: sweeps/histories_3b.jsonl      # from collect_histories.py --steps 100
  base_eval:
    value: sweeps/base_3b/eval_steps.csv  # from evaluate.py on the base model, for the plot
  out_dir:
    value: sweeps/wandb_3b
  trial_steps:
    value: 150
  eval_episodes:
    value: 16
  eval_steps:
    value: 60
  batch_size:
    value: 16
  seed:
    value: 0
